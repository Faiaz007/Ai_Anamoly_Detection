<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intelligent API Monitor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Intelligent API Monitor</h1>
      <p class="subtitle">AI-powered anomaly detection &amp; alerting</p>
    </header>

    <div class="toolbar">
      <button id="btnRefresh" class="btn btn-primary">Refresh Alerts</button>
      <span id="statusBadge" class="badge badge-neutral">Idle</span>
      <span id="countBadge" class="badge badge-neutral">0 alerts</span>
    </div>

    <section class="card">
      <h2>Active Alerts</h2>
      <div id="emptyState" class="empty-state" style="display:none;">
        <p>No active anomalies. All monitored APIs are healthy.</p>
      </div>
      <div id="alertsList" class="alerts-list"></div>
    </section>

    <section class="card">
      <h2>Submit API Responses for Monitoring</h2>
      <p class="hint">Paste a JSON array of API response objects to detect anomalies.</p>
      <textarea id="jsonInput" rows="6" placeholder='[
  {
    "api_name": "PatientDataAPI",
    "response_time_ms": 1200,
    "status_code": 200,
    "records_returned": 50
  },
  {
    "api_name": "AppointmentAPI",
    "response_time_ms": 5500,
    "status_code": 500,
    "records_returned": 0
  }
]'></textarea>
      <div class="input-actions">
        <button id="btnSubmit" class="btn btn-primary">Detect Anomalies</button>
        <button id="btnLoadExample" class="btn btn-secondary">Load Example</button>
      </div>
      <div id="submitResult" class="result-box" style="display:none;"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
